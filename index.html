<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Relations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#212B29;
  --ink-soft:#5B6864;
  --ink-faint:#8A958F;
  --paper:#ECEFE8;
  --paper-raised:#F8F9F4;
  --line:#D7DCD0;
  --teal:#33645A;
  --teal-deep:#1E4640;
  --teal-tint:#DDE8E3;
  --amber:#CD8A34;
  --amber-deep:#A66C21;
  --amber-tint:#F5E4C6;
  --rust:#AE5A38;
  --rust-tint:#F1DCD2;
  --white:#FFFFFF;
  --shadow: 0 1px 2px rgba(33,43,41,.06), 0 8px 24px rgba(33,43,41,.08);
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:28px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink:#EDEFE9;
    --ink-soft:#B7C0B8;
    --ink-faint:#7C877E;
    --paper:#161B19;
    --paper-raised:#1F2624;
    --line:#333D39;
    --teal:#6FAE9E;
    --teal-deep:#8FC6B6;
    --teal-tint:#223531;
    --amber:#E3A85B;
    --amber-deep:#EFC488;
    --amber-tint:#3A2F1D;
    --rust:#DE8A69;
    --rust-tint:#3A2620;
    --white:#20302B;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#EDEFE9;
  --ink-soft:#B7C0B8;
  --ink-faint:#7C877E;
  --paper:#161B19;
  --paper-raised:#1F2624;
  --line:#333D39;
  --teal:#6FAE9E;
  --teal-deep:#8FC6B6;
  --teal-tint:#223531;
  --amber:#E3A85B;
  --amber-deep:#EFC488;
  --amber-tint:#3A2F1D;
  --rust:#DE8A69;
  --rust-tint:#3A2620;
  --white:#20302B;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

*,*::before,*::after{box-sizing:border-box;}
html{
  scroll-padding-top: env(safe-area-inset-top, 0px);
  height:100%;
}
body{
  margin:0;
  min-height:100%;
  background:var(--paper);
  color:var(--ink);
  font-family:'Work Sans', -apple-system, sans-serif;
  font-size:16px;
  line-height:1.5;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{
  font-family:'Fraunces', Georgia, serif;
  font-weight:600;
  letter-spacing:-0.01em;
  margin:0;
  color:var(--ink);
}
p{margin:0;}
button{font-family:inherit;}
a{color:inherit;}
img{max-width:100%;display:block;}
:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

.hidden{display:none !important;}

/* ---------- layout shells ---------- */
#app{min-height:100vh;}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
@media (max-width:640px){.wrap{padding:0 18px;}}

/* ---------- top nav (marketing) ---------- */
.topnav{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 0;
}
.brand{
  display:flex;align-items:center;gap:10px;
  font-family:'Fraunces',serif;font-weight:600;font-size:20px;
}
.brand-mark{
  width:30px;height:30px;border-radius:9px;
  background:linear-gradient(155deg,var(--teal) 0%, var(--teal-deep) 100%);
  position:relative;flex:none;
}
.brand-mark::after{
  content:"";position:absolute;inset:7px;
  border-radius:5px;background:var(--amber);
  transform:translate(3px,3px);
}
.nav-actions{display:flex;gap:10px;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 22px;border-radius:999px;border:1.5px solid transparent;
  font-size:15px;font-weight:600;cursor:pointer;
  transition:transform .15s ease, background .15s ease, border-color .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--teal-deep);color:#fff;}
.btn-primary:hover{background:var(--teal);}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.btn-ghost:hover{border-color:var(--ink-soft);}
.btn-amber{background:var(--amber);color:#2A1C05;}
.btn-amber:hover{background:var(--amber-deep);color:#fff;}
.btn-small{padding:8px 14px;font-size:13px;}
.btn-block{width:100%;}
.btn-danger-text{background:none;border:none;color:var(--rust);font-weight:600;font-size:13px;cursor:pointer;padding:4px 0;}
.btn-icon{
  width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);
  background:var(--paper-raised);color:var(--ink);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;
}
.btn-icon:hover{border-color:var(--ink-soft);}

/* ---------- hero ---------- */
.hero{padding:38px 0 70px;}
.hero-grid{
  display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;
}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;gap:40px;}}
.hero-eyebrow{color:var(--teal-deep);font-weight:600;font-size:14px;margin-bottom:14px;}
.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.05;}
.hero-sub{
  margin-top:20px;font-size:18px;color:var(--ink-soft);max-width:46ch;line-height:1.6;
}
.hero-actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;}
.hero-photo-wrap{position:relative;padding:18px 10px 30px 30px;}
.hero-photo-frame{
  position:absolute;inset:0 20px 10px 0;
  background:var(--amber);border-radius:var(--radius-l);
  transform:rotate(-3deg);
}
.hero-photo{
  position:relative;border-radius:var(--radius-l);overflow:hidden;
  transform:rotate(1.5deg);box-shadow:var(--shadow);
  border:6px solid var(--paper-raised);
}
.hero-photo img{width:100%;height:auto;display:block;}

/* ---------- steps ---------- */
.steps-section{padding:10px 0 80px;}
.steps-head{max-width:56ch;margin-bottom:36px;}
.steps-head h2{font-size:clamp(26px,3.4vw,34px);}
.steps-head p{margin-top:12px;color:var(--ink-soft);font-size:16px;}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
@media (max-width:800px){.steps{grid-template-columns:1fr;}}
.step{
  background:var(--paper-raised);border:1px solid var(--line);
  border-radius:var(--radius-m);padding:26px;
}
.step-num{
  font-family:'Fraunces',serif;font-size:15px;font-weight:600;
  color:var(--teal-deep);
  width:34px;height:34px;border-radius:50%;background:var(--teal-tint);
  display:flex;align-items:center;justify-content:center;margin-bottom:16px;
}
.step h3{font-size:19px;margin-bottom:8px;}
.step p{color:var(--ink-soft);font-size:14.5px;line-height:1.55;}

.footer-note{
  padding:26px 0 50px;color:var(--ink-faint);font-size:13.5px;
  border-top:1px solid var(--line);
}

/* ---------- auth ---------- */
.auth-shell{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:40px 20px;position:relative;overflow:hidden;
}
.auth-bg{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg, rgba(30,70,64,.88), rgba(30,70,64,.94)),
    var(--bg-photo, none);
  background-size:cover;background-position:center 20%;
  filter:grayscale(.15);
}
.auth-card{
  position:relative;width:100%;max-width:420px;
  background:var(--paper-raised);border-radius:var(--radius-l);
  box-shadow:0 30px 60px rgba(0,0,0,.25);
  padding:36px 32px;
}
.auth-brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px;font-family:'Fraunces',serif;font-weight:600;font-size:19px;}
.auth-tabs{display:flex;background:var(--paper);border-radius:999px;padding:4px;margin-bottom:24px;}
.auth-tab{
  flex:1;text-align:center;padding:10px 0;border-radius:999px;font-weight:600;font-size:14px;
  cursor:pointer;color:var(--ink-soft);
}
.auth-tab.active{background:var(--teal-deep);color:#fff;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;border-radius:var(--radius-s);border:1.5px solid var(--line);
  background:var(--white);color:var(--ink);font-size:15px;font-family:inherit;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);}
.field-hint{font-size:12.5px;color:var(--ink-faint);margin-top:5px;}
.field-error{font-size:12.5px;color:var(--rust);margin-top:5px;}
.form-msg{
  font-size:13.5px;padding:10px 14px;border-radius:var(--radius-s);margin-bottom:16px;
  background:var(--rust-tint);color:var(--rust);
}
.form-msg.ok{background:var(--teal-tint);color:var(--teal-deep);}
.auth-switch{text-align:center;margin-top:18px;font-size:13.5px;color:var(--ink-soft);}
.auth-switch button{background:none;border:none;color:var(--teal-deep);font-weight:600;cursor:pointer;font-size:13.5px;padding:0;}

/* ---------- onboarding / family picker ---------- */
.center-shell{
  min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
  padding:60px 20px;
}
.onboard-card{width:100%;max-width:640px;}
.onboard-head{margin-bottom:28px;}
.onboard-head h1{font-size:30px;}
.onboard-head p{margin-top:10px;color:var(--ink-soft);}
.family-list{display:flex;flex-direction:column;gap:12px;margin-bottom:26px;}
.family-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:16px 18px;border:1.5px solid var(--line);border-radius:var(--radius-m);
  background:var(--paper-raised);
}
.family-row-info{display:flex;align-items:center;gap:12px;}
.family-avatar{
  width:42px;height:42px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:600;color:#fff;font-size:17px;flex:none;
}
.family-row-name{font-weight:600;font-size:15.5px;}
.family-row-sub{font-size:12.5px;color:var(--ink-faint);margin-top:2px;}
.onboard-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:560px){.onboard-actions{grid-template-columns:1fr;}}
.option-card{
  border:1.5px dashed var(--line);border-radius:var(--radius-m);
  padding:20px;text-align:left;background:transparent;cursor:pointer;
}
.option-card:hover{border-color:var(--teal);background:var(--teal-tint);}
.option-card h3{font-size:16px;margin-bottom:5px;}
.option-card p{font-size:13px;color:var(--ink-soft);}
.code-display{
  font-family:'Fraunces',serif;font-size:28px;letter-spacing:.12em;font-weight:600;
  background:var(--amber-tint);color:var(--amber-deep);
  padding:14px 18px;border-radius:var(--radius-s);text-align:center;margin:14px 0;
}

/* ---------- dashboard shell ---------- */
.dash{display:flex;min-height:100vh;}
.sidebar{
  width:272px;flex:none;background:var(--teal-deep);color:#EFF4F1;
  padding:24px 20px;display:flex;flex-direction:column;
  padding-top: calc(24px + env(safe-area-inset-top, 0px));
}
@media (max-width:880px){
  .dash{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;padding:16px 18px;}
  .sidebar-section{display:none;}
  .sidebar-brand{margin-bottom:0 !important;}
}
.sidebar-brand{display:flex;align-items:center;gap:9px;font-family:'Fraunces',serif;font-weight:600;font-size:18px;margin-bottom:26px;color:#fff;}
.sidebar-brand .brand-mark::after{background:var(--amber);}
.sidebar-label{font-size:11.5px;text-transform:none;color:#AEC6BE;font-weight:600;margin-bottom:10px;letter-spacing:.02em;}
.family-switcher{
  display:flex;flex-direction:column;gap:8px;margin-bottom:8px;
}
.fam-btn{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
  background:rgba(255,255,255,.06);border:1.5px solid transparent;cursor:pointer;text-align:left;
  color:#EFF4F1;
}
.fam-btn.active{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);}
.fam-btn:hover{background:rgba(255,255,255,.12);}
.fam-btn-dot{width:9px;height:9px;border-radius:50%;flex:none;}
.fam-btn-name{font-size:14px;font-weight:600;}
.sidebar-section{margin-bottom:26px;}
.sidebar-link{
  display:flex;align-items:center;gap:10px;padding:9px 4px;font-size:14px;
  color:#D6E6DF;cursor:pointer;background:none;border:none;width:100%;text-align:left;
}
.sidebar-link:hover{color:#fff;}
.sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.14);}
.sidebar-account{font-size:13.5px;color:#EFF4F1;font-weight:600;margin-bottom:8px;}
.sidebar-account-email{font-size:12px;color:#AEC6BE;font-weight:400;margin-top:2px;}

.main{flex:1;min-width:0;padding:28px 32px 60px;padding-top: calc(28px + env(safe-area-inset-top, 0px));}
@media (max-width:640px){.main{padding:20px 18px 50px;}}
.main-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
.main-head h1{font-size:26px;}
.main-head-sub{color:var(--ink-soft);font-size:14px;margin-top:4px;}
.share-code-pill{
  display:inline-flex;align-items:center;gap:8px;background:var(--amber-tint);color:var(--amber-deep);
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
}

.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;}
.child-col{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-m);
  padding:18px;display:flex;flex-direction:column;
}
.child-col-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.child-avatar{
  width:40px;height:40px;border-radius:12px;color:#fff;font-family:'Fraunces',serif;font-weight:600;
  display:flex;align-items:center;justify-content:center;flex:none;font-size:16px;
}
.child-name{font-weight:600;font-size:16px;}
.child-progress-track{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden;}
.child-progress-fill{height:100%;border-radius:3px;background:var(--teal);}
.child-col-menu{margin-left:auto;}
.task-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;min-height:8px;}
.task-card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius-s);
  padding:12px 13px;display:flex;gap:10px;align-items:flex-start;
}
.task-card.done{opacity:.55;}
.task-check{
  width:20px;height:20px;border-radius:6px;border:1.6px solid var(--ink-faint);
  flex:none;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:var(--white);
}
.task-check.checked{background:var(--teal);border-color:var(--teal);color:#fff;}
.task-body{flex:1;min-width:0;}
.task-title{font-size:14.5px;font-weight:600;line-height:1.35;}
.task-card.done .task-title{text-decoration:line-through;}
.task-desc{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.4;}
.task-meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--paper);color:var(--ink-soft);}
.pill.due-today{background:var(--amber-tint);color:var(--amber-deep);}
.pill.overdue{background:var(--rust-tint);color:var(--rust);}
.pill.recurring{background:var(--teal-tint);color:var(--teal-deep);}
.task-del{background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:2px;flex:none;}
.task-del:hover{color:var(--rust);}
.empty-tasks{font-size:13px;color:var(--ink-faint);padding:14px 0;text-align:center;}
.add-task-btn{
  border:1.5px dashed var(--line);border-radius:var(--radius-s);background:transparent;
  padding:10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;
}
.add-task-btn:hover{border-color:var(--teal);color:var(--teal-deep);}
.add-child-col{
  border:1.5px dashed var(--line);border-radius:var(--radius-m);
  display:flex;align-items:center;justify-content:center;min-height:180px;
  background:transparent;cursor:pointer;color:var(--ink-soft);font-weight:600;font-size:14.5px;flex-direction:column;gap:8px;
}
.add-child-col:hover{border-color:var(--teal);color:var(--teal-deep);}

.empty-state{
  text-align:center;padding:70px 20px;color:var(--ink-soft);
}
.empty-state h2{font-size:22px;margin-bottom:10px;color:var(--ink);}

/* ---------- modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(20,28,26,.5);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:50;
}
.modal{
  width:100%;max-width:460px;background:var(--paper-raised);border-radius:var(--radius-l);
  padding:28px;max-height:90vh;overflow-y:auto;
}
.modal h2{font-size:20px;margin-bottom:18px;}
.modal-actions{display:flex;gap:10px;margin-top:6px;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{
  padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:13.5px;font-weight:600;
  cursor:pointer;background:var(--white);color:var(--ink-soft);
}
.chip.selected{border-color:var(--teal);background:var(--teal-tint);color:var(--teal-deep);}
.color-dot-row{display:flex;gap:9px;flex-wrap:wrap;}
.color-dot{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;}
.color-dot.selected{border-color:var(--ink);}

.toast{
  position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow);z-index:80;
}
</style>
</head>
<body>

<script>
// ===================== Family Relations — app logic =====================

const CHILD_COLORS = ['#33645A','#CD8A34','#5C7A99','#B76E6E','#8A8F5C','#7A5C99'];

// ---------- tiny helpers ----------
const $ = (sel, el=document) => el.querySelector(sel);
const $all = (sel, el=document) => Array.from(el.querySelectorAll(sel));
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function genFamilyCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no confusing chars
  let out='';
  for(let i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashPassword(email, pwd){
  return sha256('family-relations::v1::'+email.trim().toLowerCase()+'::'+pwd);
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('nl-BE', {day:'numeric', month:'short'});
}
function dueInfo(iso){
  if(!iso) return null;
  const today = todayISO();
  if(iso === today) return {label:'Vandaag', cls:'due-today'};
  if(iso < today) return {label:'Verlopen · '+fmtDate(iso), cls:'overdue'};
  const tmr = new Date(); tmr.setDate(tmr.getDate()+1);
  if(iso === tmr.toISOString().slice(0,10)) return {label:'Morgen', cls:''};
  return {label:fmtDate(iso), cls:''};
}
function toast(msg){
  const old = $('.toast'); if(old) old.remove();
  const node = el(`<div class="toast">${escapeHtml(msg)}</div>`);
  document.body.appendChild(node);
  setTimeout(()=>node.remove(), 2600);
}

// ---------- local persistence: accounts & sessions (per device) ----------
function getAccounts(){ try{ return JSON.parse(localStorage.getItem('fr_accounts')||'[]'); }catch(e){ return []; } }
function saveAccounts(list){ localStorage.setItem('fr_accounts', JSON.stringify(list)); }
function findAccount(email){ return getAccounts().find(a=>a.email.toLowerCase()===String(email).toLowerCase().trim()); }
function getSession(){ try{ return JSON.parse(localStorage.getItem('fr_session')||'null'); }catch(e){ return null; } }
function setSession(email){ localStorage.setItem('fr_session', JSON.stringify({email})); }
function clearSession(){ localStorage.removeItem('fr_session'); }

function getMyFamilyIds(email){
  try{ return JSON.parse(localStorage.getItem('fr_families::'+email.toLowerCase())||'[]'); }catch(e){ return []; }
}
function saveMyFamilyIds(email, ids){
  localStorage.setItem('fr_families::'+email.toLowerCase(), JSON.stringify(ids));
}
function addMyFamilyId(email, id){
  const ids = getMyFamilyIds(email);
  if(!ids.includes(id)){ ids.push(id); saveMyFamilyIds(email, ids); }
}
function removeMyFamilyId(email, id){
  saveMyFamilyIds(email, getMyFamilyIds(email).filter(x=>x!==id));
}

// ---------- backend: real db capability, or a local single-device fallback ----------
let dbApi = null;
let dbChecked = false;
const backendReady = (async () => {
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      dbApi = await window.claude.use('db');
    }
  }catch(e){ dbApi = null; }
  dbChecked = true;
})();

function getLocalStore(){
  try{ return JSON.parse(localStorage.getItem('fr_localdb')||'{"families":{},"tasks":{}}'); }
  catch(e){ return {families:{}, tasks:{}}; }
}
function saveLocalStore(store){ localStorage.setItem('fr_localdb', JSON.stringify(store)); }
function fireLocalChange(){ window.dispatchEvent(new Event('fr-local-change')); }

async function familyGet(id){
  if(dbApi){
    const snap = await dbApi.doc('families/'+id).get();
    return snap.exists ? snap.data() : null;
  }
  const store = getLocalStore();
  return store.families[id] || null;
}
async function familyCreate(id, data){
  if(dbApi){ await dbApi.doc('families/'+id).set(data); return; }
  const store = getLocalStore();
  store.families[id] = data;
  saveLocalStore(store);
  fireLocalChange();
}
async function familyUpdate(id, partial){
  if(dbApi){ await dbApi.doc('families/'+id).update(partial); return; }
  const store = getLocalStore();
  store.families[id] = Object.assign({}, store.families[id]||{}, partial);
  saveLocalStore(store);
  fireLocalChange();
}
function familyWatch(id, cb){
  if(dbApi){
    return dbApi.doc('families/'+id).onSnapshot(
      snap => cb(snap.exists ? snap.data() : null),
      err => { console.error('familyWatch', err); cb(null); }
    );
  }
  const handler = () => { const store = getLocalStore(); cb(store.families[id] || null); };
  handler();
  window.addEventListener('fr-local-change', handler);
  window.addEventListener('storage', handler);
  return () => { window.removeEventListener('fr-local-change', handler); window.removeEventListener('storage', handler); };
}
function tasksWatch(familyId, cb){
  if(dbApi){
    return dbApi.collection('tasks').where('familyId','==',familyId).onSnapshot(
      snap => cb(snap.docs.map(d => Object.assign({id:d.id}, d.data()))),
      err => { console.error('tasksWatch', err); cb([]); }
    );
  }
  const handler = () => {
    const store = getLocalStore();
    const arr = Object.keys(store.tasks)
      .filter(id => store.tasks[id].familyId === familyId)
      .map(id => Object.assign({id}, store.tasks[id]));
    cb(arr);
  };
  handler();
  window.addEventListener('fr-local-change', handler);
  window.addEventListener('storage', handler);
  return () => { window.removeEventListener('fr-local-change', handler); window.removeEventListener('storage', handler); };
}
async function taskAdd(data){
  if(dbApi){ const ref = await dbApi.collection('tasks').add(data); return ref.id; }
  const store = getLocalStore();
  const id = uid('t');
  store.tasks[id] = data;
  saveLocalStore(store);
  fireLocalChange();
  return id;
}
async function taskUpdate(id, partial){
  if(dbApi){ await dbApi.doc('tasks/'+id).update(partial); return; }
  const store = getLocalStore();
  store.tasks[id] = Object.assign({}, store.tasks[id]||{}, partial);
  saveLocalStore(store);
  fireLocalChange();
}
async function taskDelete(id){
  if(dbApi){ await dbApi.doc('tasks/'+id).delete(); return; }
  const store = getLocalStore();
  delete store.tasks[id];
  saveLocalStore(store);
  fireLocalChange();
}

const state = {
  screen: 'landing',       // landing | auth | onboarding | dashboard
  authMode: 'register',    // register | login
  account: null,           // {name, email}
  familyIds: [],
  familyMeta: {},          // id -> {name, childCount}
  activeFamilyId: null,
  activeFamily: null,      // {name, children:[...], code}
  tasks: [],
  selectedChildId: null,
  modal: null,
  unsubFamily: null,
  unsubTasks: null,
  busy: false,
};

function teardownFamilySubs(){
  if(state.unsubFamily){ state.unsubFamily(); state.unsubFamily=null; }
  if(state.unsubTasks){ state.unsubTasks(); state.unsubTasks=null; }
}

async function refreshFamilyMeta(){
  const entries = await Promise.all(state.familyIds.map(async id => {
    const data = await familyGet(id);
    return [id, data];
  }));
  entries.forEach(([id,data]) => {
    if(data) state.familyMeta[id] = {name:data.name, childCount:(data.children||[]).length};
  });
}

function selectFamily(id){
  teardownFamilySubs();
  state.activeFamilyId = id;
  state.activeFamily = null;
  state.tasks = [];
  state.selectedChildId = null;
  render();
  state.unsubFamily = familyWatch(id, (data) => {
    state.activeFamily = data;
    if(data) state.familyMeta[id] = {name:data.name, childCount:(data.children||[]).length};
    if(data && !state.selectedChildId && (data.children||[]).length){
      // keep "all children" board view; no single-select needed
    }
    render();
  });
  state.unsubTasks = tasksWatch(id, (tasks) => {
    state.tasks = tasks;
    render();
  });
}

function goto(screen){
  if(screen !== 'dashboard') teardownFamilySubs();
  state.screen = screen;
  state.modal = null;
  render();
}

async function afterLogin(email, name){
  state.account = {email, name};
  state.familyIds = getMyFamilyIds(email);
  await backendReady;
  await refreshFamilyMeta();
  if(state.familyIds.length === 1){
    goto('dashboard');
    selectFamily(state.familyIds[0]);
  } else if(state.familyIds.length > 1){
    goto('dashboard');
    selectFamily(state.familyIds[0]);
  } else {
    goto('onboarding');
  }
}

function logout(){
  clearSession();
  teardownFamilySubs();
  Object.assign(state, {
    screen:'landing', account:null, familyIds:[], familyMeta:{}, activeFamilyId:null,
    activeFamily:null, tasks:[], selectedChildId:null, modal:null,
  });
  render();
}

document.addEventListener('DOMContentLoaded', init);

function setMsg(targetId, text, ok){
  const box = document.getElementById(targetId);
  if(!box) return;
  box.innerHTML = text ? `<div class="form-msg ${ok?'ok':''}">${escapeHtml(text)}</div>` : '';
}

document.addEventListener('click', async (e) => {
  const backdrop = e.target.closest('[data-action="close-modal-backdrop"]');
  if(backdrop && e.target === backdrop){ state.modal=null; render(); return; }

  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.getAttribute('data-action');

  switch(action){
    case 'go-auth-login': state.authMode='login'; goto('auth'); break;
    case 'go-auth-register': state.authMode='register'; goto('auth'); break;
    case 'set-auth-mode': state.authMode = btn.getAttribute('data-mode'); render(); break;
    case 'logout': logout(); break;

    case 'show-create-family': state.modal={type:'create-family'}; render(); break;
    case 'show-join-family': state.modal={type:'join-family'}; render(); break;
    case 'close-modal': state.modal=null; render(); break;

    case 'enter-created-family': {
      const id = btn.getAttribute('data-id');
      state.modal = null;
      goto('dashboard');
      selectFamily(id);
      break;
    }
    case 'open-family': {
      const id = btn.getAttribute('data-id');
      goto('dashboard');
      selectFamily(id);
      break;
    }
    case 'switch-family': {
      const id = btn.getAttribute('data-id');
      if(id !== state.activeFamilyId) selectFamily(id);
      break;
    }

    case 'show-add-child': state.modal={type:'add-child', color:CHILD_COLORS[0]}; render(); break;
    case 'pick-child-color': {
      state.modal.color = btn.getAttribute('data-color');
      render();
      break;
    }
    case 'remove-child': {
      const id = btn.getAttribute('data-id');
      if(!confirm('Dit kind en de bijbehorende weergave verwijderen? Taken blijven bewaard maar worden niet meer getoond.')) return;
      const fam = state.activeFamily;
      const newChildren = (fam.children||[]).filter(c=>c.id!==id);
      await familyUpdate(state.activeFamilyId, {children:newChildren});
      break;
    }

    case 'show-add-task': {
      state.modal = {type:'add-task', childId:btn.getAttribute('data-child'), recurring:'geen'};
      render();
      break;
    }
    case 'pick-recurring': {
      state.modal.recurring = btn.getAttribute('data-value');
      render();
      break;
    }
    case 'toggle-task': {
      const id = btn.getAttribute('data-id');
      const cur = btn.getAttribute('data-current');
      await taskUpdate(id, {status: cur==='done' ? 'todo' : 'done'});
      break;
    }
    case 'delete-task': {
      const id = btn.getAttribute('data-id');
      await taskDelete(id);
      break;
    }
  }
});

document.addEventListener('submit', async (e) => {
  const form = e.target;

  if(form.matches('[data-form="login"]')){
    e.preventDefault();
    const email = form.email.value.trim();
    const pwd = form.password.value;
    const acc = findAccount(email);
    if(!acc){ setMsg('auth-msg', 'Geen account gevonden met dit e-mailadres op dit toestel.'); return; }
    const hash = await hashPassword(email, pwd);
    if(hash !== acc.passwordHash){ setMsg('auth-msg', 'Wachtwoord klopt niet.'); return; }
    setSession(email);
    setMsg('auth-msg', '');
    await afterLogin(email, acc.name);
    return;
  }

  if(form.matches('[data-form="register"]')){
    e.preventDefault();
    const name = form.name.value.trim();
    const email = form.email.value.trim();
    const pwd = form.password.value;
    if(findAccount(email)){ setMsg('auth-msg', 'Er bestaat al een account met dit e-mailadres op dit toestel. Log in.'); return; }
    const passwordHash = await hashPassword(email, pwd);
    const accounts = getAccounts();
    accounts.push({name, email, passwordHash});
    saveAccounts(accounts);
    setSession(email);
    setMsg('auth-msg', '');
    await afterLogin(email, name);
    return;
  }

  if(form.matches('[data-form="create-family"]')){
    e.preventDefault();
    const name = form.name.value.trim();
    if(!name) return;
    let code = genFamilyCode();
    let existing = await familyGet(code);
    let tries = 0;
    while(existing && tries < 5){ code = genFamilyCode(); existing = await familyGet(code); tries++; }
    await familyCreate(code, {name, children:[], createdAt: new Date().toISOString()});
    addMyFamilyId(state.account.email, code);
    state.familyIds = getMyFamilyIds(state.account.email);
    state.familyMeta[code] = {name, childCount:0};
    state.modal = {type:'family-created', id:code, name};
    render();
    return;
  }

  if(form.matches('[data-form="join-family"]')){
    e.preventDefault();
    const code = form.code.value.trim().toUpperCase();
    if(!code) return;
    const data = await familyGet(code);
    if(!data){ setMsg('modal-msg', 'Geen gezin gevonden met deze code.'); return; }
    addMyFamilyId(state.account.email, code);
    state.familyIds = getMyFamilyIds(state.account.email);
    state.familyMeta[code] = {name:data.name, childCount:(data.children||[]).length};
    state.modal = null;
    goto('dashboard');
    selectFamily(code);
    toast('Je bent lid geworden van '+data.name);
    return;
  }

  if(form.matches('[data-form="add-child"]')){
    e.preventDefault();
    const name = form.name.value.trim();
    const color = form.color.value;
    if(!name) return;
    const fam = state.activeFamily || {children:[]};
    const children = (fam.children||[]).concat([{id:uid('c'), name, color}]);
    await familyUpdate(state.activeFamilyId, {children});
    state.modal = null;
    render();
    return;
  }

  if(form.matches('[data-form="add-task"]')){
    e.preventDefault();
    const childId = form.childId.value;
    const title = form.title.value.trim();
    const description = form.description.value.trim();
    const dueDate = form.dueDate.value;
    const recurring = form.recurring.value;
    if(!title || !childId) return;
    await taskAdd({
      familyId: state.activeFamilyId,
      childId, title, description, dueDate, recurring,
      status: 'todo',
      createdAt: new Date().toISOString(),
    });
    state.modal = null;
    render();
    toast('Taak toegevoegd');
    return;
  }
});

// ===================== init / auto-login =====================
async function init(){
  render(); // paint landing immediately, no blocking
  const session = getSession();
  if(session && session.email){
    const acc = findAccount(session.email);
    if(acc){
      await afterLogin(acc.email, acc.name);
      return;
    }
  }
}
</script>
